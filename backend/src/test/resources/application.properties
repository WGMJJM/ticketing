# 业务回归显式关闭后台线程；重启补偿测试用真实应用参数单独启用并关闭上下文。
# 普通/历史业务回归不依赖Redis限流；RateLimitIT在隔离Redis命名空间显式启用保护。
ticketing.security.rate-limit.enabled=false
ticketing.order.expiry.enabled=false
ticketing.order.aftercare.enabled=false
ticketing.waitlist.jobs.enabled=false
ticketing.waitlist.messaging.enabled=false
ticketing.purchase.jobs-enabled=false
ticketing.purchase.messaging-enabled=false
ticketing.messaging.jobs-enabled=false
ticketing.catalog-cache.enabled=false
ticketing.purchase.admission-limit.enabled=false
# 每个测试上下文使用随机生成的测试专用密钥，不在仓库保存固定签名密钥。
ticketing.checkin.credential-keys={"1":"${random.value}${random.value}"}
ticketing.checkin.backfill.enabled=false
