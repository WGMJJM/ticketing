spring:
  task:
    scheduling:
      pool:
        size: 3
  application:
    name: ticketing
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:ticketing}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8
    username: ${MYSQL_USER:ticketing}
    password: ${MYSQL_PASSWORD}
    hikari:
      connection-init-sql: SET time_zone = '+00:00'
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      connect-timeout: 3s
      timeout: 3s
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        default-requeue-rejected: false
        prefetch: 1
        concurrency: 2
        retry:
          enabled: true
          max-attempts: 4
          initial-interval: 1s
          multiplier: 2
          max-interval: 8s
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:ticketing}
    password: ${RABBITMQ_PASSWORD}
    connection-timeout: 5s
  jackson:
    time-zone: UTC
    deserialization:
      accept-float-as-int: false
    serialization:
      write-dates-as-timestamps: false
server:
  address: 127.0.0.1
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:true}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
ticketing:
  order:
    max-per-user-session: ${ORDER_SESSION_LIMIT:4}
    payment-window-minutes: ${ORDER_PAYMENT_WINDOW_MINUTES:15}
    expiry:
      enabled: ${ORDER_EXPIRY_ENABLED:true}
      scan-delay-ms: ${ORDER_EXPIRY_SCAN_DELAY_MS:30000}
      batch-size: ${ORDER_EXPIRY_BATCH_SIZE:100}
  admin-bootstrap:
    enabled: ${ADMIN_BOOTSTRAP_ENABLED:false}
    username: ${ADMIN_BOOTSTRAP_USERNAME:}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:}
  waitlist:
    max-wait-minutes: ${WAITLIST_MAX_WAIT_MINUTES:60}
    dispatch-max-steps: 50
    messaging:
      enabled: ${WAITLIST_MESSAGING_ENABLED:true}
    jobs:
      enabled: ${WAITLIST_JOBS_ENABLED:true}
    exchange: ticketing.waitlist
    queue: ticketing.waitlist.dispatch
    outbox-poll-ms: ${WAITLIST_OUTBOX_POLL_MS:1000}
    compensation-poll-ms: ${WAITLIST_COMPENSATION_POLL_MS:60000}
    compensation-batch-size: 100
    outbox:
      batch-size: 20
      lease-seconds: 30
      confirm-timeout-ms: 5000
      max-attempts: 10
      retry-base-seconds: 2
      retry-max-seconds: 300
