spring:
  application:
    name: ticketing
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:ticketing}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8
    username: ${MYSQL_USER:ticketing}
    password: ${MYSQL_PASSWORD}
    hikari:
      connection-init-sql: SET time_zone = '+00:00'
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      connect-timeout: 3s
      timeout: 3s
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:ticketing}
    password: ${RABBITMQ_PASSWORD}
    connection-timeout: 5s
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
server:
  address: 127.0.0.1
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
ticketing:
  dev-admin:
    enabled: ${DEV_ADMIN_ENABLED:false}
    username: ${DEV_ADMIN_USERNAME:}
    password: ${DEV_ADMIN_PASSWORD:}
