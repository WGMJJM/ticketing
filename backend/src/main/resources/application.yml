spring:
  task:
    scheduling:
      pool:
        size: 3
  application:
    name: ticketing
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:ticketing}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8
    username: ${MYSQL_USER:ticketing}
    password: ${MYSQL_PASSWORD}
    hikari:
      connection-init-sql: SET time_zone = '+00:00'
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:500ms}
      timeout: ${REDIS_COMMAND_TIMEOUT:500ms}
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        default-requeue-rejected: false
        prefetch: 1
        concurrency: 2
        retry:
          enabled: true
          max-attempts: 4
          initial-interval: 1s
          multiplier: 2
          max-interval: 8s
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:ticketing}
    password: ${RABBITMQ_PASSWORD}
    connection-timeout: 5s
  jackson:
    time-zone: UTC
    deserialization:
      accept-float-as-int: false
    serialization:
      write-dates-as-timestamps: false
server:
  forward-headers-strategy: none
  address: 127.0.0.1
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:true}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
ticketing:
  catalog-cache:
    enabled: ${CATALOG_CACHE_ENABLED:true}
    maximum-entries: ${CATALOG_CACHE_MAXIMUM_ENTRIES:2000}
    local-seconds: ${CATALOG_CACHE_LOCAL_SECONDS:15}
    redis-seconds: ${CATALOG_CACHE_REDIS_SECONDS:120}
    negative-seconds: ${CATALOG_CACHE_NEGATIVE_SECONDS:5}
    concurrent-loads: ${CATALOG_CACHE_CONCURRENT_LOADS:8}
    load-wait-ms: ${CATALOG_CACHE_LOAD_WAIT_MS:100}
    namespace: ${CATALOG_CACHE_NAMESPACE:catalog}
  purchase:
    admission-limit:
      enabled: ${PURCHASE_ADMISSION_LIMIT_ENABLED:false}
      global-rate: ${PURCHASE_ADMISSION_GLOBAL_RATE:20}
      global-burst: ${PURCHASE_ADMISSION_GLOBAL_BURST:40}
      ticket-rate: ${PURCHASE_ADMISSION_TICKET_RATE:10}
      ticket-burst: ${PURCHASE_ADMISSION_TICKET_BURST:20}
      namespace: ${PURCHASE_ADMISSION_NAMESPACE:purchase}
    capacity: ${PURCHASE_CAPACITY:200}
    queue-seconds: ${PURCHASE_QUEUE_SECONDS:120}
    lease-seconds: ${PURCHASE_LEASE_SECONDS:30}
    recovery-seconds: ${PURCHASE_RECOVERY_SECONDS:10}
    batch-size: ${PURCHASE_RECOVERY_BATCH_SIZE:100}
    scan-delay-ms: ${PURCHASE_SCAN_DELAY_MS:1000}
    jobs-enabled: ${PURCHASE_JOBS_ENABLED:true}
    messaging-enabled: ${PURCHASE_MESSAGING_ENABLED:true}
    exchange: ticketing.purchase
    queue: ticketing.purchase.orders
  messaging:
    jobs-enabled: ${OUTBOX_JOBS_ENABLED:true}
  security:
    client-address:
      mode: ${CLIENT_ADDRESS_MODE:DIRECT}
      trusted-proxies: ${CLIENT_ADDRESS_TRUSTED_PROXIES:}
      max-forwarded-hops: ${CLIENT_ADDRESS_MAX_FORWARDED_HOPS:8}
      max-forwarded-header-length: ${CLIENT_ADDRESS_MAX_FORWARDED_HEADER_LENGTH:1024}
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      key-secret: ${RATE_LIMIT_KEY_SECRET:}
      namespace: ${RATE_LIMIT_NAMESPACE:default}
      unavailable-retry-seconds: ${RATE_LIMIT_UNAVAILABLE_RETRY_SECONDS:1}
      csrf-session-ip:
        limit: ${RATE_LIMIT_CSRF_SESSION_IP_LIMIT:120}
        window-seconds: ${RATE_LIMIT_CSRF_SESSION_IP_WINDOW_SECONDS:60}
      login-ip:
        limit: ${RATE_LIMIT_LOGIN_IP_LIMIT:60}
        window-seconds: ${RATE_LIMIT_LOGIN_IP_WINDOW_SECONDS:60}
      login-account-ip:
        limit: ${RATE_LIMIT_LOGIN_ACCOUNT_IP_LIMIT:10}
        window-seconds: ${RATE_LIMIT_LOGIN_ACCOUNT_IP_WINDOW_SECONDS:60}
      register-ip:
        limit: ${RATE_LIMIT_REGISTER_IP_LIMIT:10}
        window-seconds: ${RATE_LIMIT_REGISTER_IP_WINDOW_SECONDS:600}
      order-user:
        limit: ${RATE_LIMIT_ORDER_USER_LIMIT:30}
        window-seconds: ${RATE_LIMIT_ORDER_USER_WINDOW_SECONDS:10}
      waitlist-user:
        limit: ${RATE_LIMIT_WAITLIST_USER_LIMIT:10}
        window-seconds: ${RATE_LIMIT_WAITLIST_USER_WINDOW_SECONDS:60}
  checkin:
    credential-keys: ${TICKET_CREDENTIAL_KEYS:}
    current-key-version: ${TICKET_CREDENTIAL_CURRENT_VERSION:1}
    opens-before-minutes: ${CHECKIN_OPENS_BEFORE_MINUTES:60}
    backfill:
      enabled: ${TICKET_BACKFILL_ENABLED:false}
      batch-size: ${TICKET_BACKFILL_BATCH_SIZE:100}
      scan-delay-ms: ${TICKET_BACKFILL_SCAN_DELAY_MS:30000}
  order:
    aftercare:
      enabled: ${ORDER_AFTERCARE_ENABLED:true}
      scan-delay-ms: ${ORDER_AFTERCARE_SCAN_DELAY_MS:10000}
      batch-size: ${ORDER_AFTERCARE_BATCH_SIZE:100}
      max-attempts: ${ORDER_AFTERCARE_MAX_ATTEMPTS:5}
      retry-delay-seconds: ${ORDER_AFTERCARE_RETRY_DELAY_SECONDS:30}
    max-per-user-session: ${ORDER_SESSION_LIMIT:4}
    payment-window-minutes: ${ORDER_PAYMENT_WINDOW_MINUTES:15}
    expiry:
      enabled: ${ORDER_EXPIRY_ENABLED:true}
      scan-delay-ms: ${ORDER_EXPIRY_SCAN_DELAY_MS:30000}
      batch-size: ${ORDER_EXPIRY_BATCH_SIZE:100}
  admin-bootstrap:
    enabled: ${ADMIN_BOOTSTRAP_ENABLED:false}
    username: ${ADMIN_BOOTSTRAP_USERNAME:}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:}
  waitlist:
    max-wait-minutes: ${WAITLIST_MAX_WAIT_MINUTES:60}
    dispatch-max-steps: 50
    messaging:
      enabled: ${WAITLIST_MESSAGING_ENABLED:true}
    jobs:
      enabled: ${WAITLIST_JOBS_ENABLED:true}
    exchange: ticketing.waitlist
    queue: ticketing.waitlist.dispatch
    outbox-poll-ms: ${WAITLIST_OUTBOX_POLL_MS:1000}
    compensation-poll-ms: ${WAITLIST_COMPENSATION_POLL_MS:60000}
    compensation-batch-size: 100
    outbox:
      batch-size: ${WAITLIST_OUTBOX_BATCH_SIZE:100}
      lease-seconds: 30
      confirm-timeout-ms: 5000
      max-attempts: 10
      retry-base-seconds: 2
      retry-max-seconds: 300
