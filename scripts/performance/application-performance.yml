# 仅由压测工具显式加载，端口、库名与正常开发环境完全分离。
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:13307/ticketing_perf?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8
    username: ticketing_perf
    password: ${PERF_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}
      minimum-idle: 10
  data:
    redis:
      port: 16379
  rabbitmq:
    port: 15673
    username: ticketing_perf
    password: ${PERF_MQ_PASSWORD}
server:
  port: 18080
  servlet:
    session:
      cookie:
        secure: false
management:
  metrics:
    distribution:
      percentiles:
        "ticketing.trade.transaction.duration": [0.95, 0.99]
  endpoints:
    web:
      # 沿用现有 ADMIN 授权及账号状态复查，不公开 JVM/连接池指标。
      base-path: /api/v1/admin/monitoring
      exposure:
        include: health,info,metrics
  info:
    env:
      enabled: true
info:
  performance:
    environment: ticketing-perf-only
ticketing:
  security:
    client-address:
      mode: DIRECT
      trusted-proxies: []
    rate-limit:
      # 专用工具显式选择关闭对照、放宽阈值回归或生产阈值验证；不继承开发限流参数。
      enabled: ${PERF_RATE_LIMIT_ENABLED:true}
      key-secret: ${PERF_RATE_LIMIT_KEY_SECRET:}
      namespace: perf_stage12
      csrf-session-ip:
        limit: ${PERF_RATE_LIMIT_CSRF_SESSION_IP:120}
      login-ip:
        limit: ${PERF_RATE_LIMIT_LOGIN_IP:60}
      login-account-ip:
        limit: ${PERF_RATE_LIMIT_LOGIN_ACCOUNT_IP:10}
      register-ip:
        limit: ${PERF_RATE_LIMIT_REGISTER_IP:10}
      order-user:
        limit: ${PERF_RATE_LIMIT_ORDER_USER:30}
      waitlist-user:
        limit: ${PERF_RATE_LIMIT_WAITLIST_USER:10}
  checkin:
    credential-keys: ${PERF_TICKET_KEYS}
    backfill:
      enabled: false
  admin-bootstrap:
    enabled: true
    username: perf_admin
    password: ${PERF_ADMIN_PASSWORD}
  order:
    payment-window-minutes: ${ORDER_PAYMENT_WINDOW_MINUTES:1}
    expiry:
      scan-delay-ms: ${ORDER_EXPIRY_SCAN_DELAY_MS:1000}
  waitlist:
    compensation-poll-ms: ${WAITLIST_COMPENSATION_POLL_MS:60000}
    outbox:
      batch-size: ${TICKETING_WAITLIST_OUTBOX_BATCH_SIZE:100}
