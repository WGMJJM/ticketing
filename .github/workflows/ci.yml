name: 基础构建与架构检查
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: 后端普通测试与架构守卫
        run: mvn -B -f backend/pom.xml clean verify
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 前端锁依赖及严格构建
        working-directory: frontend
        run: |
          npm ci
          npm run build
      # mysql-it、真实浏览器和性能验收在有guard的专用环境执行，本工作流不声称覆盖它们。
